    <g id="broccoli">
      <path d="M-3.2 0L-2.2 -10H2.2L3.2 0Z" fill="#bbdf99"/>
      <g fill="#38964d">
        <circle cx="-6.5" cy="-11.4" r="5.2"/><circle cx="6.5" cy="-11.4" r="5.2"/><circle cx="0" cy="-15.9" r="6.6"/>
        <circle cx="-2.8" cy="-9.9" r="4.6"/><circle cx="3" cy="-9.9" r="4.6"/>
      </g>
      <g fill="#61bd67">
        <circle cx="-6.5" cy="-13" r="5.2"/><circle cx="6.5" cy="-13" r="5.2"/><circle cx="0" cy="-17.5" r="6.6"/>
        <circle cx="-2.8" cy="-11.5" r="4.6"/><circle cx="3" cy="-11.5" r="4.6"/>
      </g>
    </g>
    <rect id="carrot" x="-2.4" y="-17" width="4.8" height="17" rx="2.4" fill="#f18848"/>
  </defs>
  <rect width="512" height="512" rx="112" fill="#1b2440"/>
