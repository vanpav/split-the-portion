    <use href="#carrot" transform="translate(40.1 31) rotate(-10) scale(1.32)"/>
    <use href="#broccoli" transform="translate(61 31) rotate(8) scale(1.43)"/>
    <rect x="25" y="30" width="50" height="12" rx="4" fill="#9cc8f0"/>
    <rect x="25" y="48.5" width="50" height="11" rx="4" fill="#f6d15c"/>
    <rect x="21.5" y="45" width="57" height="6.5" rx="3.25" fill="#ffffff"/>
